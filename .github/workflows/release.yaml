---
name: Close release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version type after release
        required: true
        type: choice
        default: "patch"
        options:
          - rc
          - patch
          - minor
          - major
      yank_crate:
        description: "Yank mode: crate name to yank or restore instead of closing a release. Leave empty to close a release."
        required: false
        type: string
        default: ""
      yank_version:
        description: Exact version to yank or restore, such as 0.12.0
        required: false
        type: string
        default: ""
      yank_undo:
        description: Restore a yanked version instead of yanking it
        required: false
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build-library:
    name: Build Library
    if: inputs.yank_crate == ''
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # build-library-v4.0.0
    permissions:
      contents: read
      id-token: write
    with:
      repo_sha: ${{ github.sha }}
      version_type: release
      architecture: x86_64-linux
      build_file: Cargo.toml
      # Empty so the reusable workflow releases the whole virtual workspace
      # (`cargo release publish --workspace`); "hopr-impls" is not a crate.
      package_name: ""
      runner: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  release:
    name: Close release
    if: inputs.yank_crate == ''
    needs:
      - build-library
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Release version
        uses: hoprnet/hopr-workflows/actions/release-version@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # release-version-v5.1.1
        with:
          source_branch: ${{ github.ref_name }}
          file: Cargo.toml
          release_type: ${{ inputs.release_type }}
          # This is a virtual workspace with independent per-crate versions, so there is no
          # single repo version to bump. Disable the automatic post-release bump: the publish
          # step (`cargo release publish --workspace`) already releases only crates whose
          # version is not yet on crates.io, and each crate's version is bumped in the PR that
          # changes it. This avoids re-versioning every crate on every release.
          bump_version: false
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          zulip_api_key: ${{ secrets.ZULIP_API_KEY }}
          zulip_email: ${{ secrets.ZULIP_EMAIL }}
          zulip_channel: hopr-impls
          zulip_topic: Releases
          github_app_private_key: ${{ secrets.GH_APP_HOPRNET_BOT_PRIVATE_KEY }}
  yank:
    name: Yank ${{ inputs.yank_crate }} ${{ inputs.yank_version }}
    if: inputs.yank_crate != ''
    runs-on: depot-ubuntu-24.04-2
    permissions:
      id-token: write # crates.io trusted publishing, bound to this workflow file
    env:
      CRATE: ${{ inputs.yank_crate }}
      VERSION: ${{ inputs.yank_version }}
      UNDO: ${{ inputs.yank_undo }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if ! [[ "$CRATE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::yank_crate must contain only letters, digits, '-' and '_'" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::yank_version must be an exact semver version such as 0.12.0" >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      - name: Yank or restore version on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [[ "$UNDO" == "true" ]]; then
            action=unyank
            method=PUT
          else
            action=yank
            method=DELETE
          fi
          url="https://crates.io/api/v1/crates/${CRATE}/${VERSION}/${action}"
          status=$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            --request "$method" \
            --user-agent "hopr-impls-yank-workflow (github actions)" \
            --header "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            "$url")
          cat /tmp/response.json
          echo
          if [[ "$status" != "200" ]]; then
            echo "::error::crates.io answered HTTP $status for ${action} of ${CRATE} ${VERSION}" >&2
            exit 1
          fi
          echo "${action} of ${CRATE} ${VERSION} succeeded"
