[advisories]
ignore = [
  "RUSTSEC-2024-0388", # derivative: unmaintained, but widely used transitive dependency
  "RUSTSEC-2024-0436", # paste: unmaintained, but widely used transitive dependency
  "RUSTSEC-2026-0173", # proc-macro-error2: unmaintained, used by aquamarine and alloy
  # hickory-proto is pulled in transitively via libp2p-dns (pinned to ^0.25 by
  # libp2p). All hickory-proto advisories below can only be cleared by a major libp2p bump.
  "RUSTSEC-2026-0118", # hickory-proto: NSEC3 unbounded loop — no fixed upstream release available
  "RUSTSEC-2026-0119", # hickory-proto: O(n^2) name compression — fix (>=0.26.1) requires a libp2p major upgrade
  "RUSTSEC-2026-0487", # hickory-proto: panic on malformed `alpn` value in SVCB/HTTPS records — fix (>=0.26.2) requires a libp2p major upgrade
  "RUSTSEC-2026-0489", # hickory-proto: panic on single-quote SVCB/HTTPS parameter value — fix (>=0.26.2) requires a libp2p major upgrade
  "RUSTSEC-2026-0490", # hickory-proto: zone file lexer panics on tokens of 4096+ characters — fix (>=0.26.2) requires a libp2p major upgrade
  "RUSTSEC-2026-0491", # hickory-proto: memory amplification from DNS message header record counts — fix (>=0.26.2) requires a libp2p major upgrade
  "RUSTSEC-2026-0504", # hickory-proto 0.25: inverted NSEC3 comparison in DNSSEC validation — no fixed upgrade; requires a libp2p major upgrade
  "RUSTSEC-2026-0505", # hickory-proto 0.25: NSEC3 owner names not checked against the zone in DNSSEC validation — no fixed upgrade; requires a libp2p major upgrade
  "RUSTSEC-2026-0511", # hickory-proto 0.25: NXDOMAIN accepted for a proven empty non-terminal in DNSSEC validation — no fixed upgrade; requires a libp2p major upgrade
  "RUSTSEC-2026-0512", # hickory-proto 0.25: DNSSEC validation accepted an unrelated signed RRset — no fixed upgrade; requires a libp2p major upgrade
  "RUSTSEC-2026-0514", # hickory-resolver 0.25: lookups returned records that failed DNSSEC validation — fix (>=0.26.2) requires a libp2p major upgrade
  # pin-utils 0.1.1 is unmaintained and enters the lockfile via wasmtimer 0.4.3.
  # Drop this ignore once upstream removes pin-utils or replaces it with a maintained crate.
  "RUSTSEC-2026-0441", # pin-utils: unmaintained transitive dependency
  # smartstring 1.0.1 is unmaintained with no patched release. It enters the tree via
  # opentelemetry-prometheus-text-exporter 0.3.0 -> smartstring 1.0.1; drop this ignore once
  # that exporter switches to a maintained replacement.
  "RUSTSEC-2026-0249", # smartstring: unmaintained
  # crypto-bigint 0.5.5 enters the tree via alloy -> elliptic-curve 0.13.8 -> k256 0.13.4.
  # The fix (>=0.7.6) needs a k256/elliptic-curve major bump that alloy 2.5.0 does not pull in
  # yet; drop this ignore once alloy moves to a k256 0.14+ line.
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5: constant-time timing variability
]
