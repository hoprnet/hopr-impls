[workspace]
members = [
  "connector",
  "ct/full-network",
  "ct/immediate",
  "graph",
  "session-server-forwarder",
  "ticket-manager",
  "transport/p2p",
]
resolver = "3"

[workspace.metadata.release]
# All member crates are new on crates.io. Raise cargo-release's client-side
# new-package check so the `--workspace` publish dry-run (CI "Library / Build")
# verifies all crates instead of aborting. The crates.io server-side limit of
# 5 new crates / 24h still applies to the actual `--execute` publish, which is
# performed in batches during the initial release.
rate-limit.new-packages = 10

[workspace.package]
authors      = ["HOPR Association <tech@hoprnet.org>"]
edition      = "2024"
homepage     = "https://hoprnet.org/"
license      = "GPL-3.0-only"
repository   = "https://github.com/hoprnet/hopr-impls"
rust-version = "1.97"

[workspace.dependencies]
# In-repo crates (path + version so they are publishable)
hopr-chain-connector = { path = "connector", version = "0.25.0" }
hopr-network-graph   = { path = "graph", version = "0.7.0", default-features = false }

# HOPR crates published to crates.io
blokli-client = "0.32.1"
hopr-api      = "4.1.0"
hopr-utils    = { package = "hopr-utilities", version = "0.12.0", default-features = false }

# Third-party dependencies (versions mirror hoprnet's workspace to preserve compatibility)
ahash = "0.8.12"
anyhow = "1.0.104"
assertables = "10.1.0"
async-broadcast = "0.7.2"
async-trait = "0.1.92"
async_channel_io = "0.3.0"
atomic_enum = "0.3.0"
backon = { version = "1.6.0", default-features = false }
bimap = "0.6.3"
bytes = "1.12.1"
cfg-if = "1.0.4"
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
const-hex = "1.19.1"
criterion = { version = "0.8.2", default-features = false, features = [
  "async_tokio",
  "cargo_bench_support",
] }
dashmap = { version = "6.2.1", features = ["inline"] }
futures = { version = "0.3.34", default-features = false, features = [
  "async-await",
  "std",
] }
futures-concurrency = "7.7.1"
futures-time = "3.1.0"
hashbrown = "0.17.1"
hex-literal = "1.1.0"
humantime-serde = "1.1.1"
indexmap = { version = "2.14.1" }
insta = { version = "1.48.0", features = ["redactions", "yaml"] }
lazy_static = "1.5.0"
libp2p = { version = "0.56.0", default-features = false }
libp2p-stream = { version = "0.4.0-alpha" }
moka = { version = "0.12.16", features = ["future", "sync"] }
more-asserts = "0.3.1"
multiaddr = "0.18.2"
parking_lot = "0.12.5"
petgraph = { version = "0.8.3", default-features = false, features = [
  "rayon",
  "serde-1",
  "stable_graph",
  "std",
] }
pin-project = "1.1.13"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
quinn-udp = { version = "0.6.1", default-features = false }
rand = { version = "0.10.2", features = ["thread_rng"] }
redb = "4.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.22.0", features = ["base64"] }
smallvec = "1.15.2"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "tracing",
] }
tokio-retry = "0.3.2"
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
validator = { version = "0.21.0", features = ["derive"] }
